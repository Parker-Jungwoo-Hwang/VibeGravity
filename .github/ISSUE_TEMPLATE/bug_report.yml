name: Bug report
description: Report a reproducible private-validation bug.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include commands and redacted output.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: VibeGravity version or commit
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
  - type: textarea
    id: gates
    attributes:
      label: Verification
      description: Did `make eval` or `make integration-postgres` pass?
