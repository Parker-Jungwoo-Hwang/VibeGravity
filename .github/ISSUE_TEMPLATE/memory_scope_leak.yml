name: Memory scope leak
description: Report suspected private memory, workspace, group, or actor leakage.
title: "[scope-leak] "
labels: ["security", "privacy", "scope"]
body:
  - type: markdown
    attributes:
      value: "Do not post secrets, raw private memory, credentials, tokens, or unredacted production data. Use SECURITY.md for sensitive reports."
  - type: input
    id: commit
    attributes:
      label: VibeGravity version or commit
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
    validations:
      required: true
  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version
    validations:
      required: true
  - type: input
    id: migration
    attributes:
      label: Migration version
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or MCP call
    validations:
      required: true
  - type: input
    id: expected_scope
    attributes:
      label: Expected scope
    validations:
      required: true
  - type: input
    id: observed_scope
    attributes:
      label: Observed scope
    validations:
      required: true
  - type: input
    id: actor
    attributes:
      label: Actor
    validations:
      required: true
  - type: input
    id: workspace
    attributes:
      label: Workspace
    validations:
      required: true
  - type: input
    id: group
    attributes:
      label: Group
  - type: textarea
    id: output
    attributes:
      label: Redacted recall output
      description: Redact private memory text and secrets.
    validations:
      required: true
  - type: dropdown
    id: make_eval
    attributes:
      label: Does make eval pass?
      options: ["yes", "no", "not run"]
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Does make integration-postgres pass?
      options: ["yes", "no", "skipped", "not run"]
    validations:
      required: true
