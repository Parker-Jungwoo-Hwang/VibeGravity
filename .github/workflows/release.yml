name: Release CI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vibegravity_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vibegravity_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VIBEGRAVITY_DB_URL: postgres://postgres:postgres@localhost:5432/vibegravity_integration?sslmode=disable
      VIBEGRAVITY_MIGRATION_PATH: migrations
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tools
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make setup
          go install github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3

      - name: Release local gate
        run: make release-gate

      - name: Build requested command set
        run: |
          go build ./cmd/server ./cmd/worker ./cmd/cli
          go build ./cmd/vibegravity

      - name: Apply migrations
        run: migrate -path "$VIBEGRAVITY_MIGRATION_PATH" -database "$VIBEGRAVITY_DB_URL" up

      - name: Live PostgreSQL integration
        run: make integration-postgres

      - name: Build release smoke binaries
        run: make build

      - name: CLI smoke
        run: |
          bin/cli version
          bin/cli eval demo
          bin/cli hermes bootstrap --name vibegravity --command "$(pwd)/bin/cli"
          bin/vibegravity version

      - name: MCP stdio smoke
        run: |
          set -euo pipefail
          output="$(
            printf '%s\n' \
              '{"jsonrpc":"2.0","id":"init","method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"release-ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","id":"list","method":"tools/list"}' \
              '{"jsonrpc":"2.0","id":"recall","method":"tools/call","params":{"name":"recall_preview","arguments":{"tenant_id":"tenant_release","workspace_id":"workspace_release","session_id":"session_release","actor_id":"agent:release","query":"release smoke","budget_tokens":128,"mode":"default"}}}' \
            | bin/cli mcp serve --stdio
          )"
          printf '%s\n' "$output"
          grep -q '"protocolVersion":"2025-11-25"' <<<"$output"
          grep -q '"name":"recall_preview"' <<<"$output"
          grep -q '"id":"recall"' <<<"$output"
