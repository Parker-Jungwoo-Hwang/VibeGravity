name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-gates:
    name: Local gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tools
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make setup

      - name: Test
        run: go test -count=1 ./...

      - name: Eval
        run: make eval

      - name: Lint
        run: make lint

      - name: Headers
        run: make check-headers

      - name: Whitespace
        run: git diff --check

      - name: Build
        run: |
          go build ./cmd/server ./cmd/worker ./cmd/cli
          go build ./cmd/vibegravity

      - name: Module verify
        run: go mod verify

      - name: Vulnerability check
        run: govulncheck ./...

      - name: CLI smoke
        run: |
          mkdir -p bin
          go build -ldflags "-X main.version=ci" -o bin/cli ./cmd/cli
          go build -ldflags "-X main.version=ci" -o bin/vibegravity ./cmd/vibegravity
          bin/cli version
          bin/cli eval demo
          bin/cli hermes bootstrap --name vibegravity --command "$(pwd)/bin/cli"
          bin/vibegravity version

  postgres-gate:
    name: PostgreSQL integration gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vibegravity_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vibegravity_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VIBEGRAVITY_DB_URL: postgres://postgres:postgres@localhost:5432/vibegravity_integration?sslmode=disable
      VIBEGRAVITY_MIGRATION_PATH: migrations
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install migrate
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3

      - name: Apply migrations
        run: migrate -path "$VIBEGRAVITY_MIGRATION_PATH" -database "$VIBEGRAVITY_DB_URL" up

      - name: Live PostgreSQL integration
        run: make integration-postgres

      - name: Build CLI binary
        run: |
          mkdir -p bin
          go build -ldflags "-X main.version=ci" -o bin/cli ./cmd/cli

      - name: MCP stdio smoke
        run: |
          set -euo pipefail
          output="$(
            printf '%s\n' \
              '{"jsonrpc":"2.0","id":"init","method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","id":"list","method":"tools/list"}' \
              '{"jsonrpc":"2.0","id":"recall","method":"tools/call","params":{"name":"recall_preview","arguments":{"tenant_id":"tenant_ci","workspace_id":"workspace_ci","session_id":"session_ci","actor_id":"agent:ci","query":"ci smoke","budget_tokens":128,"mode":"default"}}}' \
            | bin/cli mcp serve --stdio
          )"
          printf '%s\n' "$output"
          grep -q '"protocolVersion":"2025-11-25"' <<<"$output"
          grep -q '"name":"recall_preview"' <<<"$output"
          grep -q '"id":"recall"' <<<"$output"
